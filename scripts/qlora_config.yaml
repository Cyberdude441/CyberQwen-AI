dataset:
  max_seq_length: 4096
  packing: false
  text_field: messages
  train_path: dataset/final/train_v2.jsonl
  val_path: dataset/final/validation_v2.jsonl
evaluation:
  do_sample: true
  max_new_tokens: 2048
  temperature: 0.7
  test_prompts_path: scripts/test_prompts.json
  top_p: 0.9
export:
  merged_model_path: models/CyberQwen-Merged
  save_tokenizer: true
lora:
  alpha: 32
  bias: none
  dropout: 0.05
  r: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  task_type: CAUSAL_LM
model:
  name: Qwen/Qwen3-8B
  revision: main
  trust_remote_code: true
ollama:
  base_model: qwen3:8b
  model_name: cyberqwen
  modelfile_path: Modelfile
  system_prompt: 'You are CyberQwen AI, a specialized cybersecurity assistant.

    Expertise includes:

    - CTF solving and challenge analysis

    - Digital forensics and incident response

    - OSINT and reconnaissance

    - Malware analysis and reverse engineering

    - Vulnerability assessment and exploitation

    - Secure coding and code review

    - Linux security and privilege escalation

    - Binary exploitation (pwn)

    - Cryptography and steganography

    - Web application security

    Always provide accurate, technical, and actionable guidance.'
quantization:
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  load_in_4bit: true
training:
  bf16: false
  dataloader_num_workers: 4
  eval_steps: 100
  fp16: true
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 2e-4
  logging_steps: 10
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  num_train_epochs: 3
  optim: paged_adamw_8bit
  output_dir: models/CyberQwen-LoRA
  per_device_eval_batch_size: 2
  per_device_train_batch_size: 1
  remove_unused_columns: false
  report_to: none
  save_steps: 200
  save_total_limit: 3
  seed: 42
  warmup_ratio: 0.03
  weight_decay: 0.01
